name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Passende Fabric-Versionen fuer 1.21.11 holen
        run: |
          YARN=$(curl -fsS https://meta.fabricmc.net/v2/versions/yarn/1.21.11 | jq -r '.[0].version')
          LOADER=$(curl -fsS https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
          API=$(curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*+1\.21\.11</version>' | sed 's/<[^>]*>//g' | tail -1)
          echo "yarn=$YARN loader=$LOADER api=$API"
          test -n "$YARN" && test "$YARN" != "null" && test -n "$LOADER" && test -n "$API"
          {
            echo "yarn_mappings=$YARN"
            echo "loader_version=$LOADER"
            echo "fabric_version=$API"
          } >> gradle.properties

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: redtextures-jar
          path: build/libs/*.jar
